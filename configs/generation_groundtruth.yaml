# Candidate generation for the ground-truth evaluation subset.
# Identical recipe to configs/generation_1000.yaml (same model, same two
# temperatures) so the ground-truth candidates are produced exactly the same
# way as every training candidate — the only thing that differs is which
# articles they come from.

model_name: "models/Mistral-7B-Instruct-v0.3"

max_input_length: 1024
max_new_tokens: 256
padding_side: "left"

candidates_per_article: 2
generation_configs:
  - name: "low_temp"
    temperature: 0.7
    top_p: 0.9
    do_sample: true
  - name: "high_temp"
    temperature: 1.0
    top_p: 0.95
    do_sample: true

batch_size: 4

load_in_4bit: false

subset_path: "data/subset/subset_groundtruth.jsonl"
output_dir: "data/candidates"
output_filename: "candidates_groundtruth.jsonl"
